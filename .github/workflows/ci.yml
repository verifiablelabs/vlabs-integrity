name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # No vulnerability-fixed pytest release supports Python 3.9. Keep
          # the declared floor covered by lint/import/demo without installing
          # the vulnerable pytest 8 line; run the full suite on 3.12.
          - python-version: "3.9"
            lockfile: requirements-ci-py39.lock
            full-tests: false
          - python-version: "3.12"
            lockfile: requirements-ci.lock
            full-tests: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "${{ matrix.python-version }}" }
      # Python 3.9 cannot run the first non-vulnerable pip release (26.1.2),
      # so use a checksum-verified, exact uv binary for both matrix entries.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.28"
          enable-cache: false
      - name: Install the Python-3.9-compatible locked CI surface
        run: |
          uv pip install --system --python python --require-hashes -r .github/${{ matrix.lockfile }}
          uv pip install --system --python python --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests
      - run: python -m compileall -q src
      - run: python -m vlabs_integrity.cli demo
      - if: matrix.full-tests
        run: python -m pytest tests -q
